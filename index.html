<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0d" />
    <title>MyAuto Handover</title>
  
<script>
window.__errLog = [];
function __pushErr(kind, msg) {
window.__errLog.push('[' + kind + '] ' + msg);
var el = document.getElementById('errPanel');
if (el) el.textContent = window.__errLog.join('\n');
var badge = document.getElementById('errBadge');
if (badge) { badge.style.display = 'grid'; badge.textContent = String(window.__errLog.length); }
}
window.addEventListener('error', function (e) {
__pushErr('error', (e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0));
}, true);
window.addEventListener('unhandledrejection', function (e) {
var r = e.reason;
__pushErr('reject', String((r && r.message) || r));
});
var __origErr = console.error;
console.error = function () {
__pushErr('console', Array.prototype.slice.call(arguments).map(String).join(' '));
__origErr.apply(console, arguments);
};
window.addEventListener('DOMContentLoaded', function () {
var badge = document.createElement('button');
badge.id = 'errBadge';
badge.type = 'button';
badge.textContent = '0';
badge.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:99999;width:42px;height:42px;border-radius:50%;border:1px solid #c33;background:#fff;color:#c11;font:800 14px sans-serif;place-items:center;display:none';
var panel = document.createElement('pre');
panel.id = 'errPanel';
panel.style.cssText = 'position:fixed;left:8px;right:8px;bottom:62px;z-index:99999;max-height:45vh;overflow:auto;background:#101010;color:#7CFC7C;font:11px/1.45 monospace;padding:10px;border-radius:10px;display:none;white-space:pre-wrap;word-break:break-word';
document.body.appendChild(badge);
document.body.appendChild(panel);
badge.onclick = function () { panel.style.display = (panel.style.display === 'none') ? 'block' : 'none'; };
setTimeout(function () {
var appEl = document.getElementById('app');
if (appEl && !appEl.innerHTML.trim()) __pushErr('diag', 'APP BOS QALDI: main.ts yuklenmedi ve ya render olmadi');
}, 4000);
});
</script>
</head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
